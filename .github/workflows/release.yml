name: Release

# Publishes a GitHub Release automatically for every version tag, with:
#  - a title/body (hand-written intro + GitHub's auto-generated notes)
#  - the built dist/ output as a tarball asset (this is a compiled Vite app -
#    the Dockerfile/deb/rpm packaging all just extract and serve this
#    directly, they never run `npm run build` themselves) that
#    OCSInventory-Server-Packages' own release pipeline downloads to build
#    the .deb/.rpm/docker artifacts
#    (see https://github.com/OCSInventory-NG/OCSInventory-Server-Packages)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  PKG: ocsinventory-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build release tarball
        run: |
          mv dist "${PKG}"
          tar -czf "${PKG}-${{ github.ref_name }}.tar.gz" "${PKG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "OCS Inventory Frontend ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            OCS Inventory Frontend ${{ github.ref_name }}.

            If you are upgrading from version 2.X, check our documentation to see what's changed and our migration guide:
            - https://documentation.ocsinventory-ng.org/project-overview/v2-vs-v3-whats-changed#architecture
            - https://documentation.ocsinventory-ng.org/project-overview/migration-guide
          files: "${{ env.PKG }}-${{ github.ref_name }}.tar.gz"
